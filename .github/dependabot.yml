version: 2
enable-beta-ecosystems: true
registries:
  nav-ghpr:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: '@navikt'
    token: ${{ secrets.READER_TOKEN }}

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Oslo'
    open-pull-requests-limit: 5
    registries: '*'
    groups:
      npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Oslo'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
